
name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Test Node.js API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-root-password
          MYSQL_DATABASE: gamehub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3306
      TEST_DB_USER: root
      TEST_DB_PASSWORD: test-only-root-password
      TEST_DB_NAME: gamehub_test
      TEST_DB_ALLOW_RESET: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend unit and MySQL integration tests
        run: npm test

  build:
    name: Build, test and lint Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble instrumented tests (not executed without an emulator)
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      - name: Run Android instrumentation tests on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-configuration-cache connectedDebugAndroidTest --stacktrace

      - name: Test release API URL policy
        run: ./gradlew testReleaseApiConfiguration --stacktrace

      - name: Verify missing release URL fails the actual release build gate
        shell: bash
        run: |
          set -euo pipefail
          if output="$(./gradlew --no-configuration-cache assembleRelease 2>&1)"; then
            echo "assembleRelease unexpectedly succeeded without RELEASE_API_BASE_URL"
            exit 1
          fi
          printf '%s\n' "$output" | grep -F "Set RELEASE_API_BASE_URL to the hosted HTTPS API before building a release."

      - name: Verify release API validation errors
        shell: bash
        run: |
          set -euo pipefail
          assert_rejected() {
            local endpoint="$1"
            local expected="$2"
            local output
            if output="$(./gradlew --no-configuration-cache validateReleaseApiConfiguration "-PRELEASE_API_BASE_URL=$endpoint" 2>&1)"; then
              echo "Release URL policy unexpectedly accepted $endpoint"
              exit 1
            fi
            if ! grep -Fq "$expected" <<<"$output"; then
              printf '%s\n' "$output"
              echo "Expected validation message was missing: $expected"
              exit 1
            fi
          }
          assert_rejected "http://api.example.test/" "Release builds require an HTTPS API base URL."
          assert_rejected "https://127.0.0.1/" "Release builds must not use a local-only API base URL."
          assert_rejected "https://[::1]/" "Release builds must not use a local-only API base URL."
          ./gradlew --no-configuration-cache validateReleaseApiConfiguration -PRELEASE_API_BASE_URL=https://api.example.test/

      - name: Build release APK with validation-only HTTPS fixture
        run: ./gradlew assembleRelease -PRELEASE_API_BASE_URL=https://api.example.test/ --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: loot-gamehub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
