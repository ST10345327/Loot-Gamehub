name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore release keystore
        env:
          GAMEHUB_RELEASE_KEYSTORE_BASE64: ${{ secrets.GAMEHUB_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$GAMEHUB_RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Missing repository secret GAMEHUB_RELEASE_KEYSTORE_BASE64."
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/gamehub-release.jks"
          printf '%s' "$GAMEHUB_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          if [ ! -s "$keystore_path" ]; then
            echo "::error::The decoded release keystore is empty."
            exit 1
          fi
          echo "GAMEHUB_RELEASE_KEYSTORE=$keystore_path" >> "$GITHUB_ENV"

      - name: Restore Firebase Android configuration
        env:
          GAMEHUB_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GAMEHUB_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$GAMEHUB_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Missing repository secret GAMEHUB_GOOGLE_SERVICES_JSON_BASE64."
            exit 1
          fi
          printf '%s' "$GAMEHUB_GOOGLE_SERVICES_JSON_BASE64" \
            | base64 --decode > app/google-services.json
          if [ ! -s app/google-services.json ]; then
            echo "::error::The decoded Firebase configuration is empty."
            exit 1
          fi

      - name: Test, lint and build signed release APK
        env:
          GAMEHUB_RELEASE_STORE_PASSWORD: ${{ secrets.GAMEHUB_RELEASE_STORE_PASSWORD }}
          GAMEHUB_RELEASE_KEY_ALIAS: ${{ secrets.GAMEHUB_RELEASE_KEY_ALIAS }}
          GAMEHUB_RELEASE_KEY_PASSWORD: ${{ secrets.GAMEHUB_RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk \
            --title "GameHub $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
